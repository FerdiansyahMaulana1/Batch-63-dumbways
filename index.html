<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body>
  <div class="container py-5">
    <!-- Add Project -->
    <div class="mb-5">
      <h2 class="text-center mb-4">ADD MY PROJECT</h2>

      <div class="mb-3">
        <label for="name" class="form-label">Project Name</label>
        <input type="text" class="form-control" id="name" name="name" />
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="startDate" class="form-label">Start Date</label>
          <input type="date" class="form-control" id="startDate" name="startDate" />
        </div>
        <div class="col-md-6">
          <label for="endDate" class="form-label">End Date</label>
          <input type="date" class="form-control" id="endDate" name="endDate" />
        </div>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control" id="description" name="description" rows="5"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Technologies</label>
        <div class="row">
          <div class="col-md-6">
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="tech1" />
              <label class="form-check-label" for="tech1">Node JS</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="tech2" />
              <label class="form-check-label" for="tech2">React JS</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="tech3" />
              <label class="form-check-label" for="tech3">Next JS</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="tech4" />
              <label class="form-check-label" for="tech4">Typescript</label>
            </div>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <label for="image" class="form-label">Upload Image</label>
        <input type="file" class="form-control" id="image" name="image" />
      </div>

      <div class="text-end">
        <button type="submit" class="btn btn-dark" id="add">Submit</button>
      </div>
    </div>

    <!-- My Project Section -->
    <div>
      <h2 class="text-center mb-4">MY PROJECT</h2>
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 cards">
        <!-- Cards will go here -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

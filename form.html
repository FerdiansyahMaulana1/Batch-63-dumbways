<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Kontak</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary-subtle">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg p-4 rounded-4">
          <h1 class="text-center mb-4 fs-3 fw-bold">Hubungi Kami</h1>
          <form>
            <div class="mb-3">
              <label for="name" class="form-label fw-bold">Nama</label>
              <input type="text" class="form-control" id="name" placeholder="Masukkan nama Anda">
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-bold">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Masukkan email Anda">
            </div>

            <div class="mb-3">
              <label for="subject" class="form-label fw-bold">Subjek</label>
              <select class="form-select" id="subject">
                <option selected>Pilih subjek...</option>
                <option value="1">Pertanyaan</option>
                <option value="2">Masukan</option>
                <option value="3">Lainnya</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="message" class="form-label fw-bold">Pesan</label>
              <textarea class="form-control" id="message" rows="4" placeholder="Tulis pesan Anda"></textarea>
            </div>

            <button type="submit" class="btn btn-dark rounded-pill px-4 d-block mx-auto">
              Kirim
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

 </body>
</html>
